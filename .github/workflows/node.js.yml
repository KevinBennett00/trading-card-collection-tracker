name: Node.js CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - release

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/LoginApplication

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: code/LoginApplication/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
